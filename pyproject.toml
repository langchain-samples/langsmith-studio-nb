[project]
name = "langsmith-studio-nb"
version = "0.2.0"
description = "Open LangGraph Studio on an agent defined in your notebook, on Colab, Kaggle, Binder, JupyterHub, or local Jupyter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["langgraph", "langsmith", "studio", "jupyter", "colab", "notebook", "agents"]
authors = [{ name = "LangChain" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# IPython is deliberately absent. Every notebook already has one, and depending
# on it upgrades Colab out from under `google-colab`.
dependencies = [
    "langgraph-cli[inmem]>=0.4.31",
]

[project.urls]
Homepage = "https://github.com/langchain-samples/langsmith-studio-nb"
Issues = "https://github.com/langchain-samples/langsmith-studio-nb/issues"

[dependency-groups]
dev = [
    "ipython>=8.12",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "ty>=0.0.1a5",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "ANN", "B", "C4", "D", "E", "F", "I", "N",
    "PL", "PT", "RUF", "S", "SIM", "TC", "UP", "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "PLR0913", "PLR2004", "RUF012", "S101", "S310", "TC"]
# The Colab import has to stay inside the function. It probes for the host, and at
# notebook top level it would fail the cell everywhere else.
"examples/*.ipynb" = ["PLC0415"]

[tool.ty.src]
# The example notebooks import the agent stack they tell the reader to install.
# Adding it here to satisfy ty would pull ~110 MB into every `uv sync`.
exclude = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=langsmith_studio_nb --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["integration: boots a real agent server"]

[tool.coverage.run]
source = ["langsmith_studio_nb"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", '^\s*\.\.\.$']
